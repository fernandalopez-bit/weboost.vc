backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "assets/images"

locale: "es"

collections:
  - name: "portfolio"
    label: "Portfolio (Startups)"
    files:
      - name: "companies"
        label: "Startups"
        file: "data/portfolio.json"
        fields:
          - label: "Startups"
            name: "companies"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Imagen de fondo (opcional, deja vacío para usar el degradado por defecto)", name: "background", widget: "image", required: false }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Sitio web (opcional)", name: "website", widget: "string", required: false }
              - label: "Equipo fundador"
                name: "team"
                widget: "list"
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Cargo", name: "role", widget: "string" }
                  - { label: "Foto", name: "photo", widget: "image" }

  - name: "team"
    label: "Team (WeBoost)"
    files:
      - name: "members"
        label: "Integrantes"
        file: "data/team.json"
        fields:
          - label: "Integrantes"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Cargo", name: "role", widget: "string" }
              - { label: "Bio corta", name: "bio", widget: "text" }
              - { label: "Foto", name: "photo", widget: "image" }

  - name: "media"
    label: "Media (Prensa)"
    files:
      - name: "items"
        label: "Menciones de prensa"
        file: "data/media.json"
        fields:
          - label: "Menciones"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Imagen", name: "image", widget: "image" }

  - name: "home"
    label: "Home"
    files:
      - name: "home"
        label: "Página de Inicio"
        file: "data/home.json"
        fields:
          - { label: "Texto principal (hero)", name: "hero_text", widget: "text" }
          - { label: "Frase destacada al final del hero (en azul)", name: "hero_accent", widget: "string" }
          - { label: "Etiqueta pequeña sobre 'Latam Scalability'", name: "problem_eyebrow", widget: "string" }
          - { label: "Título 'Latam'", name: "scalability_title", widget: "string" }
          - { label: "Palabra destacada (Scalability)", name: "scalability_accent", widget: "string" }
          - label: "Carrusel Latam Scalability"
            name: "carousel"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto (usa **palabra** para resaltar en negrita)", name: "text", widget: "text" }
          - { label: "Título 'Our methodology'", name: "methodology_title", widget: "string" }
          - { label: "Imagen central (4 pilares)", name: "methodology_center_image", widget: "image" }
          - label: "Tarjetas metodología (columna izquierda)"
            name: "methodology_left"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Ícono", name: "icon", widget: "image" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "text", widget: "string" }
          - label: "Tarjetas metodología (columna derecha)"
            name: "methodology_right"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Ícono", name: "icon", widget: "image" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "text", widget: "string" }
          - { label: "Etiqueta 'Follow us'", name: "linkedin_eyebrow", widget: "string" }
          - { label: "Título (LinkedIn)", name: "linkedin_title", widget: "string" }
          - { label: "Texto del botón", name: "linkedin_button_text", widget: "string" }
          - { label: "Link de LinkedIn", name: "linkedin_url", widget: "string" }

  - name: "investors"
    label: "Investors"
    files:
      - name: "investors"
        label: "Página de Investors"
        file: "data/investors.json"
        fields:
          - { label: "Etiqueta (New Growth Latam Fund)", name: "label", widget: "string" }
          - { label: "Texto del botón", name: "cta_text", widget: "string" }
          - { label: "Link del botón", name: "cta_link", widget: "string" }

  - name: "connect"
    label: "Connect"
    files:
      - name: "connect"
        label: "Página de Connect"
        file: "data/connect.json"
        fields:
          - { label: "Link de LinkedIn", name: "linkedin_url", widget: "string" }
          - { label: "Link de Twitter", name: "twitter_url", widget: "string" }
          - { label: "Email de contacto", name: "email", widget: "string" }
          - { label: "Dirección", name: "address", widget: "string" }
          - { label: "Link de Google Maps para la dirección", name: "address_maps_url", widget: "string" }
          - { label: "Título sobre el formulario", name: "form_heading", widget: "string" }

  - name: "site"
    label: "Ajustes Generales (Footer y Partners)"
    files:
      - name: "site"
        label: "Redes, Footer y Strategic Partners"
        file: "data/site.json"
        fields:
          - { label: "Link de LinkedIn", name: "linkedin_url", widget: "string" }
          - { label: "Link de Twitter", name: "twitter_url", widget: "string" }
          - { label: "Email del footer", name: "footer_email", widget: "string" }
          - { label: "Texto de copyright", name: "footer_copyright", widget: "string" }
          - label: "Logos - Strategic Partners"
            name: "strategic_partners"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Nombre (texto alternativo)", name: "alt", widget: "string" }
          - label: "Logos - Footer"
            name: "footer_partners"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Nombre (texto alternativo)", name: "alt", widget: "string" }
