<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home - WeBoost</title>
<link rel="icon" href="assets/images/logo-weboost.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2" />
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      }
    });
  }
</script>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="assets/images/logo-weboost.svg" alt="WeBoost - Latam Venture Partners" />
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="investors.html">Investors</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="connect.html">Connect</a></li>
      </ul>
    </nav>
    <a href="apply.html" class="btn btn-primary btn-apply">Apply</a>
  </div>
</header>

<main>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-headline" id="hero-headline"></h1>
      <a href="#latam-scalability" class="know-more">
        <span>Know more</span>
        <span class="know-more-circle" aria-hidden="true">
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><path d="M1 1L8 8L15 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </section>

  <!-- The problem / Latam Scalability heading -->
  <section class="section section-alt" id="latam-scalability">
    <div class="container text-center">
      <p class="eyebrow" id="problem-eyebrow"></p>
      <h2 class="section-title" id="scalability-title"></h2>
    </div>

    <!-- Carousel -->
    <div class="carousel" id="scalability-carousel">
      <div class="carousel-track" id="carousel-track"></div>
      <div class="carousel-dots" role="tablist"></div>
    </div>
  </section>

  <!-- Our methodology -->
  <section class="section">
    <div class="container text-center">
      <h2 class="section-title" id="methodology-title"></h2>
    </div>
    <div class="container methodology-grid">
      <div class="methodology-col" id="methodology-left"></div>
      <div class="methodology-center">
        <img id="methodology-center-image" src="" alt="WeBoost 4 pillars methodology" />
      </div>
      <div class="methodology-col" id="methodology-right"></div>
    </div>
  </section>

  <!-- Follow us -->
  <section class="section text-center">
    <div class="container">
      <p class="eyebrow" id="linkedin-eyebrow"></p>
      <h2 class="section-title" id="linkedin-title"></h2>
      <a href="#" id="linkedin-button" target="_blank" rel="noopener" class="btn btn-primary"></a>
    </div>
  </section>

  <!-- Meet the team banner -->
  <section class="section band-accent text-center">
    <div class="container">
      <a href="team.html" class="btn btn-outline">Meet the Team</a>
    </div>
  </section>

  <!-- Strategic partners -->
  <section class="section section-alt text-center">
    <div class="container">
      <h2 class="section-title">Strategic Partners</h2>
      <div class="partners-row" id="partners-row"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/script.js?v=2"></script>
<script src="js/render.js?v=1"></script>
</body>
</html>
