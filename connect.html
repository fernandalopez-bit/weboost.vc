<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect - WeBoost</title>
<link rel="icon" href="assets/images/logo-weboost.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="assets/images/logo-weboost.svg" alt="WeBoost - Latam Venture Partners" />
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="investors.html">Investors</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="connect.html" class="active">Connect</a></li>
      </ul>
    </nav>
    <a href="apply.html" class="btn btn-primary btn-apply">Raising funds?</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>

  <section class="page-hero text-center" style="padding-bottom:20px;">
    <div class="container">
      <p class="eyebrow">WeBoost</p>
      <h1>Connect</h1>
    </div>
  </section>

  <section class="section section-alt text-center" style="padding-top:40px;">
    <div class="container contact-info-grid" id="contact-info-grid"></div>
  </section>

  <section class="section band-accent text-center" id="send-message">
    <div class="container">
      <div class="contact-tabs">
        <button type="button" class="is-active" data-panel="panel-contact">Contact Us</button>
        <button type="button" data-panel="panel-anonymous">Anonymous Complaints</button>
        <a href="apply.html" class="btn btn-outline">Apply to WeBoost</a>
      </div>

      <h2 class="section-title" id="connect-form-heading" style="color:#fff; margin-top:50px;"></h2>

      <form id="panel-contact" name="contact" method="POST" data-netlify="true" class="contact-form-panel is-active">
        <input type="hidden" name="form-name" value="contact" />
        <label>Name
          <input type="text" name="names" required />
        </label>
        <label>Email
          <input type="email" name="email" required />
        </label>
        <label>Message
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>

      <form id="panel-anonymous" name="anonymous-complaint" method="POST" data-netlify="true" class="contact-form-panel">
        <input type="hidden" name="form-name" value="anonymous-complaint" />
        <label>Message
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
    </div>
  </section>

  <section class="section section-alt text-center">
    <div class="container">
      <h2 class="section-title">Strategic Partners</h2>
      <div class="partners-row" id="partners-row"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/script.js?v=3"></script>
<script src="js/render.js?v=1"></script>
</body>
</html>
